services:
  consumer:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    privileged: false
    user: www-data
    read_only: true
    depends_on:
      localstack:
        condition: service_healthy
      mock-notify:
        condition: service_healthy
      mock-sirius:
        condition: service_healthy
    env_file: [local.env]

  consumer-test:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer-test:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    privileged: false
    user: www-data
    env_file: [local.env]

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      DEFAULT_REGION: eu-west-1
    volumes:
      - "./scripts/localstack/init:/etc/localstack/init/ready.d"
      - "./scripts/localstack/wait:/scripts/wait"
      - "./tests/fixtures:/tmp/fixtures"
    networks:
      default:
        aliases:
          - sqs.eu-west-1.localhost.localstack.cloud
    healthcheck:
      test: bash /scripts/wait/health_check.sh
      interval: 15s
      timeout: 10s
      retries: 3

  mock-notify:
    image: consumer-mock-notify:latest
    container_name: consumer-notify
    build:
      context: .
      dockerfile: docker/mock-notify/Dockerfile
    command:
      - "mock"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-notify/openapi.yml"
    volumes:
      - "./docker/mock-notify:/app/mock-notify"
    ports:
      - "4010:4010"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  mock-sirius:
    image: consumer-mock-sirius:latest
    container_name: consumer-sirius
    build:
      context: .
      dockerfile: docker/mock-sirius/Dockerfile
    command:
      - "mock"
      - "-p"
      - "4011"
      - "-h"
      - "0.0.0.0"
      - "--multiprocess"
      - "false"
      - "/app/mock-sirius/openapi.yml"
    volumes:
      - "./docker/mock-sirius:/app/mock-sirius"
    ports:
      - "4011:4011"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  composer:
    image: composer@sha256:7725eb4545c438629ae8bde3ef0bb9a5038ef566126ad878442a69007242d267
    command: ["install"]
    volumes:
      - ~/.composer:/tmp
      - ./:/app
