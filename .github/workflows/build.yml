name: Test & Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  actions: read
  checks: write
  contents: write
  deployments: none
  issues: none
  packages: none
  pull-requests: write
  repository-projects: none
  security-events: write
  statuses: none

defaults:
  run:
    shell: bash

jobs:

  qa:
    strategy:
      fail-fast: false
      matrix:
        command: ['lint', 'static-analysis', 'unit-test', 'functional-test']
    name: "QA: ${{ matrix.command }}"
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/images
          name: multi-arch-image-test
      - name: Load Image
        run: |
          docker load -i /tmp/images/multi-arch-image-test.tar
      - run: make ${{ matrix.command }}
      - name: Upload Coverage
        if: matrix.command == 'unit-test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            ./build/output/unit-coverage.txt

  create-tag:
    name: Create Tags
    uses: ./.github/workflows/create-tags.yml

  verify-readonly-fs:
    name: Verify Read-only Filesystem
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ github.ref_name == 'main' && 'arn:aws:iam::997462338508:role/sirius-component-ssm-role' || 'arn:aws:iam::679638075911:role/sirius-component-ssm-pr-role' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: cp local.env.example local.env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: opg-notify-queue-consumer-verify-readonly-fs
          aws-region: eu-west-1

      - name: Fetch ECS mounts config from SSM
        id: ssm
        run: |
          mounts_json=$(aws ssm get-parameter \
            --name "/sirius/production/ecs-mounts" \
            --region eu-west-1 \
            --query "Parameter.Value" \
            --output text)
          echo "mounts_json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$mounts_json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify docker-compose read_only/tmpfs matches infrastructure
        uses: ministryofjustice/opg-github-actions/actions/verify-readonly-fs@722a5f955424aaba01e9ca43d68390cd4048d6e1
        with:
          mounts_json: ${{ steps.ssm.outputs.mounts_json }}
          service_json: |
            { "consumer": null }

  build:
    name: Build Image
    uses: ministryofjustice/opg-github-workflows/.github/workflows/build-multi-architecture-image.yml@84a762ecab4a2d6217be908505351fd1f9312319 # v3.19.19
    with:
      image_name: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer
      build_options: --file docker/Dockerfile
      cli_commands: make copy-env

  build-test:
    name: Build Test Image
    uses: ministryofjustice/opg-github-workflows/.github/workflows/build-multi-architecture-image.yml@84a762ecab4a2d6217be908505351fd1f9312319 # v3.19.19
    with:
      image_name: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer-test
      build_options: --target=test --file docker/Dockerfile
      artifact_name: multi-arch-image-test

  push:
    name: "Push Image"
    runs-on: ubuntu-latest
    needs: ['qa', 'verify-readonly-fs', 'create-tag', 'build']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Set up Docker
        run: |
          echo '{"experimental": true, "features": { "containerd-snapshotter": true }}' | sudo tee -a /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --privileged --rm tonistiigi/binfmt --install all
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/images
          name: multi-arch-image
      - name: Load Image
        run: |
          docker load -i /tmp/images/multi-arch-image.tar

      - name: Configure OIDC AWS credentials for ECR push
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::311462405659:role/sirius-component-ecr-role
          role-session-name: opg-sirius-notify-queue-consumer-github-actions-ecr-push
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: ECR Login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: 311462405659

      - name: Snyk Scan
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          SNYK_TEST_IMAGE: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:latest
          SNYK_TOKEN: ${{ secrets.SNYK_OPG_ORG_TOKEN }}
          snyk_test_args: "--severity-threshold=high"

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: "test-results/snyk.sarif"

      - name: Tag & Push
        run: |
          docker tag 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:latest 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:${{ needs.create-tag.outputs.tag }}
          if ${{ github.ref_name == 'main' }}
          then
            docker tag 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:latest 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:main-${{ needs.create-tag.outputs.tag }}
            docker tag 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:latest 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:main-${{ needs.create-tag.outputs.tag }}-${{ needs.create-tag.outputs.timestamp }}
            # We want all of the tags pushed
            docker push  --all-tags 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer
          else
            docker push 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/notify-queue-consumer:${{ needs.create-tag.outputs.tag }}
          fi

  end_of_pr_workflow:
    name: End of PR Workflow
    runs-on: ubuntu-latest
    if: always()
    needs: ['qa', 'verify-readonly-fs', 'create-tag', 'build', 'push']
    steps:
      - name: End of PR Workflow
        run: |
          if ${{ contains(needs.*.result,'failure') }}
          then
            echo "Not all checks succedeed, check the previous jobs."
            exit 1
          else
            echo "All checks succedeed!"
            exit 0
          fi

  push-tags:
    runs-on: ubuntu-latest
    needs: [create-tag, end_of_pr_workflow]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure OIDC AWS credentials for SSM
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::997462338508:role/sirius-component-ssm-role
          role-session-name: opg-sirius-notify-queue-consumer-github-actions-ssm-push
          role-duration-seconds: 900
          aws-region: eu-west-1

      - name: Push Tag to Parameter Store
        run: |
          aws ssm put-parameter --name "opg-notify-queue-consumer-latest-green-build" --type "String" --value "${{ needs.create-tag.outputs.tag}}" --overwrite --region=eu-west-1

      - name: Trigger Dev Deploy
        shell: bash
        run: curl -u ${{ secrets.JENKINS_API_USER }}:${{ secrets.JENKINS_API_TOKEN }} "https://${{ secrets.JENKINS_URL }}/job/Sirius/job/Deploy_to_Development/build?token=${{ secrets.JENKINS_API_TOKEN_NAME }}&cause=Triggered+by+opg-notify-queue-consumer"
